name: G12 live merchant secret readiness (safe signed-event rejection)
on:
  pull_request:
    paths:
      - 'tests/g12-live-merchant-secret-readiness.test.mjs'
      - '.github/workflows/g12-live-merchant-secret-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merchant-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify runtime key readiness without receiving keys or processing payment
        run: node --test tests/g12-live-merchant-secret-readiness.test.mjs
