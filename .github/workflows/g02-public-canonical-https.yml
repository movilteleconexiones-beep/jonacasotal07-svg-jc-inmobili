name: G02 canonical HTTPS live DNS and redirect smoke
on:
  pull_request:
    paths:
      - 'tests/g02-public-canonical-https.test.mjs'
      - '.github/workflows/g02-public-canonical-https.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g02-canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check independent public DNS HTTP and HTTPS redirects
        run: node --test tests/g02-public-canonical-https.test.mjs
