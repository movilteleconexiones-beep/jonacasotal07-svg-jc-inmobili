name: New public table grants PostgreSQL
on:
  pull_request:
    paths:
      - 'tests/security/new-public-grants-postgres.sql'
      - '.github/workflows/new-public-grants.yml'
  workflow_dispatch:
jobs:
  grants-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_grants
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_grants"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci_password
      PGDATABASE: ci_grants
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/security/new-public-grants-postgres.sql
