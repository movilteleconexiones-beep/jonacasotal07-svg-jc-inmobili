name: INMOJCO #104 offline backup/restore guard
on:
  pull_request:
    paths:
      - 'scripts/ops/backup104-restore-gate.mjs'
      - 'tests/backup104-restore-gate.test.mjs'
      - 'docs/ops/backup104-private-restore-checklist.md'
      - '.github/workflows/backup104-offline-gate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/backup104-restore-gate.mjs'
      - 'tests/backup104-restore-gate.test.mjs'
      - '.github/workflows/backup104-offline-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline gates without any real backup or credentials
        run: node --test tests/backup104-restore-gate.test.mjs
      - name: Reject missing explicit archive in the public CI environment
        run: |
          set -euo pipefail
          set +e
          node scripts/ops/backup104-restore-gate.mjs --archive > "$RUNNER_TEMP/backup-refusal.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -q '^Usage:' "$RUNNER_TEMP/backup-refusal.log"

      - name: Verify a real PostgreSQL 17 custom-format archive with only synthetic rows
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE backup104_toc_fixture"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d backup104_toc_fixture <<'SQL'
          CREATE SCHEMA auth;
          CREATE SCHEMA storage;
          CREATE SCHEMA supabase_migrations;
          CREATE TABLE auth.users(id integer PRIMARY KEY);
          CREATE TABLE storage.objects(id integer PRIMARY KEY);
          CREATE TABLE supabase_migrations.schema_migrations(version text PRIMARY KEY);
          CREATE TABLE public.properties(id integer PRIMARY KEY);
          INSERT INTO auth.users VALUES (1);
          INSERT INTO storage.objects VALUES (1);
          INSERT INTO supabase_migrations.schema_migrations VALUES ('fixture-only');
          INSERT INTO public.properties VALUES (1);
          SQL
          pg_dump -h 127.0.0.1 -U postgres -d backup104_toc_fixture \
            --no-password --format=custom --file="$RUNNER_TEMP/backup104-synthetic.dump"
          node scripts/ops/backup104-restore-gate.mjs \
            --archive "$RUNNER_TEMP/backup104-synthetic.dump" > "$RUNNER_TEMP/backup104-result.json"
          node -e "const f=require('fs');const r=JSON.parse(f.readFileSync(process.env.RUNNER_TEMP+'/backup104-result.json','utf8'));if(!r.complete||r.checks.length!==4||r.restorationVerified||r.provenanceVerified||r.productionMigrationAuthorized)process.exit(2)"
