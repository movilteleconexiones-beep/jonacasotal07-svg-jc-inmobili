name: Verify JCO application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: inmojco-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jco_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jco_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: npm audit security gate (reject any published vulnerability)
        run: |
          npm audit --json > "$RUNNER_TEMP/inmojco-audit.json" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/inmojco-audit.json", "utf8"));
            if (report.error) {
              console.error("Dependency advisory service unavailable:", report.error.code ?? "unknown");
              process.exit(1);
            }
            const counts = report.metadata?.vulnerabilities;
            if (!counts || !Number.isInteger(counts.total)) {
              console.error("Invalid npm advisory report: missing counts");
              process.exit(1);
            }
            console.log("Dependency vulnerability counts:", JSON.stringify(counts));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const advisories = (item.via ?? []).filter(x => typeof x === "object")
                .map(x => ({ severity:x.severity, title:x.title, url:x.url, range:x.range }));
              console.log(JSON.stringify({ name, severity:item.severity,
                range:item.range, isDirect:item.isDirect, fixAvailable:item.fixAvailable, advisories }));
            }
            if (counts.total > 0) {
              console.error("npm security audit gate FAILED; resolve advisories before deployment");
              process.exit(1);
            }
          '
      - name: Migration lineage classification and unpublished billing-draft quarantine (#104)
        run: node --test tests/migration-lineage-audit.test.mjs
      - name: Authentic applied SQL body fingerprints, all migrations NO-GO (#104)
        run: |
          node --test tests/migration-body-fingerprint-audit.test.mjs
          node --test tests/historic-consignment-portal-preflight.test.mjs
          node --test tests/migration-format-differences-reconciliation.test.mjs
          node --test tests/historic-consignment-ddl-provenance.test.mjs
          node --test tests/consignment-restore-shape-contract.test.mjs
          node --test tests/rental-0026-baseline-contract.test.mjs
          node --test tests/finance-20261012-object-manifest.test.mjs
      - name: Historic local consignment table DDL replay vs pinned Supabase shapes (isolated PG17)
        env:
          PGPASSWORD: postgres
        run: bash security/tests/consignment_local_ddl_replay_pg17.sh
      - name: Four public SECURITY DEFINER RPC source and tenant-guard audit (#104)
        run: |
          node --test tests/public-definer-exposure-preflight.test.mjs
          node --test tests/public-rpc-source-audit.test.mjs
          node scripts/ops/public-rpc-source-audit.mjs --snapshot docs/ops/snapshots/public-rpc-catalog-2026-11-02.json
      - name: Closed billing/private table RLS and ACL deny boundary (isolated PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: |
          node --test tests/closed-privileged-table-boundary.test.mjs
          bash security/tests/closed_privileged_table_pg17.sh
      - name: Public catalog real SQL runtime isolation (PostgreSQL 17 synthetic tenants)
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          db=jco_public_catalog_runtime_test
          # PostgreSQL roles are cluster-wide. Restore the exact clean CI state
          # even if this test fails, so later fixtures can create anon/authenticated.
          cleanup() {
            status=$?
            trap - EXIT
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS $db WITH (FORCE)" || status=1
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "DROP ROLE IF EXISTS anon, authenticated" || status=1
            exit "$status"
          }
          trap cleanup EXIT
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/public_catalog_runtime_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f supabase/migrations/20261020070000_editable_public_portal_sections.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/public_catalog_runtime_assertions.sql
          # Anonymous callers must not bypass the RPC to read inventory tables.
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SET ROLE anon; SELECT count(*) FROM public.properties" > "$RUNNER_TEMP/catalog-denied.log" 2>&1; then
            echo 'ERROR: anon can query private inventory directly'; exit 1
          fi
          grep -q 'permission denied' "$RUNNER_TEMP/catalog-denied.log"
          # Negative mutation: without SECURITY DEFINER, the public catalog cannot read private tables.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "ALTER FUNCTION public.tenant_public_catalog(text) SECURITY INVOKER"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/public_catalog_runtime_assertions.sql > "$RUNNER_TEMP/catalog-negative.log" 2>&1; then
            echo 'ERROR: SQL-runtime catalog regression failed to detect invalid definer'; exit 1
          fi
          grep -q 'permission denied' "$RUNNER_TEMP/catalog-negative.log"
      - name: Current public CRM consent and cross-tenant SQL runtime (PostgreSQL 17 fake data)
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          db=jco_public_crm_current_runtime_test
          cleanup() {
            status=$?
            trap - EXIT
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS $db WITH (FORCE)" || status=1
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "DROP ROLE IF EXISTS anon, authenticated, service_role" || status=1
            exit "$status"
          }
          trap cleanup EXIT
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/public_lead_current_runtime_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f supabase/migrations/20261021041500_public_website_contact_consent_receipts.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/public_lead_current_runtime_assertions.sql
          # Callers can create leads only through the scoped RPC, never by direct table write/read.
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SET ROLE anon; SELECT count(*) FROM public.contacts" > "$RUNNER_TEMP/lead-direct-deny.log" 2>&1; then
            echo 'ERROR: anonymous contact SELECT was allowed'; exit 1
          fi
          grep -q 'permission denied' "$RUNNER_TEMP/lead-direct-deny.log"
      - name: Public property consignment SQL runtime tenant and retry regression (PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          db=jco_public_consignment_runtime_test
          cleanup() {
            status=$?
            trap - EXIT
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS $db WITH (FORCE)" || status=1
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "DROP ROLE IF EXISTS anon, authenticated" || status=1
            exit "$status"
          }
          trap cleanup EXIT
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/public_consignment_runtime_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f supabase/migrations/20261021033500_gate_public_consignment_operational_access.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/public_consignment_runtime_assertions.sql
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SET ROLE anon; SELECT count(*) FROM public.property_consignments" > "$RUNNER_TEMP/consignment-direct-deny.log" 2>&1; then
            echo 'ERROR: anonymous read of consignations succeeded'; exit 1
          fi
          grep -q 'permission denied' "$RUNNER_TEMP/consignment-direct-deny.log"
      - name: Composite CRM agency-link FK violation and correction candidate (PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          db=jco_crm_tenant_integrity_test
          cleanup() {
            status=$?
            trap - EXIT
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS $db WITH (FORCE)" || status=1
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "DROP ROLE IF EXISTS authenticated" || status=1
            exit "$status"
          }
          trap cleanup EXIT
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/crm_tenant_links_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/crm_tenant_links_preflight.sql
          # Invalid existing cross-agency rows MUST abort the candidate BEFORE adding DDL.
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/candidates/crm_tenant_links_composite_fk.sql > "$RUNNER_TEMP/crm-fk-denied.log" 2>&1; then
            echo 'ERROR: proposed FK accepted already-crossed CRM links'; exit 1
          fi
          grep -q 'NO-GO: existing CRM cross-agency/contact links' "$RUNNER_TEMP/crm-fk-denied.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/crm_tenant_links_cleanup.sql
          # A second FK to contacts must fail BEFORE any replacement to prevent
          # PostgREST PGRST201 ambiguity (and the legacy FK must remain).
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c             "ALTER TABLE public.leads ADD CONSTRAINT crm_duplicate_contact_fk FOREIGN KEY(contact_id) REFERENCES public.contacts(id)"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/candidates/crm_tenant_links_composite_fk.sql > "$RUNNER_TEMP/crm-ambiguous-denied.log" 2>&1; then
            echo 'ERROR: CRM candidate permitted ambiguous PostgREST path'; exit 1
          fi
          grep -q 'unexpected or parallel relationship' "$RUNNER_TEMP/crm-ambiguous-denied.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c             "ALTER TABLE public.leads DROP CONSTRAINT crm_duplicate_contact_fk"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/candidates/crm_tenant_links_composite_fk.sql
          # Retry to prove idempotence, not just a successful one-shot change.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/candidates/crm_tenant_links_composite_fk.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/crm_tenant_links_assertions.sql
      - name: Six live finance function body fingerprints vs historic SQL (#104)
        run: |
          node --test tests/finance-function-equivalence-audit.test.mjs
          node scripts/ops/finance-function-equivalence-audit.mjs
      - name: Finance tenant FK, numeric checks and RLS catalog snapshot (#104)
        run: node --test tests/finance-integrity-catalog.test.mjs
      - name: Hosted Supabase MAINTAIN executor permissions readiness (#104)
        run: |
          node --test tests/maintain-executor-readiness.test.mjs
          node scripts/ops/maintain-executor-readiness.mjs --snapshot docs/ops/snapshots/maintain-executor-readiness-2026-11-02.json
      - name: API MAINTAIN privilege isolation and two-tenant RLS (PostgreSQL 17 disposable)
        env:
          PGPASSWORD: postgres
        run: bash security/tests/public_api_maintain_revocation_pg17.sh
      - name: Phased MAINTAIN remediation and final owner sweep (isolated PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: bash security/tests/public_api_maintain_two_phase_pg17.sh
      - name: Maintenance anonymous CRUD reduction contract (isolated PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: bash security/tests/maintenance_anon_crud_pg17.sh
      - name: Maintenance/property composite tenant FK isolation (isolated PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: bash security/tests/maintenance_property_tenant_fk_pg17.sh
      - name: Commission/deal single composite tenant FK security (isolated PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: bash security/tests/commissions_deal_tenant_fk_pg17.sh
      - name: Portal contact and owner composite tenant FK security (isolated PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: bash security/tests/portal_links_tenant_composite_fks_pg17.sh
      - name: Historic finance migration drift fail-closed gate (#104)
        run: |
          node --test tests/finance-migration-gate.test.mjs
          node scripts/ops/finance-migration-gate.mjs
      - name: Express runtime patched dependencies regression
        run: node --test tests/npm-dependency-security.test.mjs
      - name: Privileged RPC anonymous allowlist and negative ACL tests (PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          db=jco_public_rpc_gate_test
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/public_rpc_exposure_gate_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/reviews/public_rpc_exposure_gate.sql
          # Unauthorized new anonymous privileged RPC must fail closed.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "CREATE FUNCTION public.private_export() RETURNS boolean LANGUAGE sql SECURITY DEFINER SET search_path='' AS 'SELECT true'; REVOKE ALL ON FUNCTION public.private_export() FROM PUBLIC; GRANT EXECUTE ON FUNCTION public.private_export() TO anon;"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/reviews/public_rpc_exposure_gate.sql > "$RUNNER_TEMP/rpc-error.log" 2>&1; then
            echo 'ERROR: unknown anonymous SECURITY DEFINER was allowed'; exit 1
          fi
          grep -q 'unauthorized anonymous SECURITY DEFINER RPC' "$RUNNER_TEMP/rpc-error.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "DROP FUNCTION public.private_export()"
          # PUBLIC is not a named RPC role; default PUBLIC EXECUTE must be rejected.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "GRANT EXECUTE ON FUNCTION public.get_public_property_intake_site(text) TO PUBLIC"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/reviews/public_rpc_exposure_gate.sql > "$RUNNER_TEMP/rpc-error.log" 2>&1; then
            echo 'ERROR: implicit PUBLIC EXECUTE was allowed'; exit 1
          fi
          grep -q 'must not inherit EXECUTE from PUBLIC' "$RUNNER_TEMP/rpc-error.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "REVOKE EXECUTE ON FUNCTION public.get_public_property_intake_site(text) FROM PUBLIC"
          # A missing pinned search_path must be rejected.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "ALTER FUNCTION public.tenant_public_catalog(text) RESET search_path"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/reviews/public_rpc_exposure_gate.sql > "$RUNNER_TEMP/rpc-error.log" 2>&1; then
            echo 'ERROR: unsafe search_path was allowed'; exit 1
          fi
          grep -q 'unfixed search_path' "$RUNNER_TEMP/rpc-error.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "ALTER FUNCTION public.tenant_public_catalog(text) SET search_path=''"
          # No API role may create/replace objects in the API schema.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "GRANT CREATE ON SCHEMA public TO authenticated"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/reviews/public_rpc_exposure_gate.sql > "$RUNNER_TEMP/rpc-error.log" 2>&1; then
            echo 'ERROR: schema CREATE grant was allowed'; exit 1
          fi
          grep -q 'must never CREATE objects in public schema' "$RUNNER_TEMP/rpc-error.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "REVOKE CREATE ON SCHEMA public FROM authenticated"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/reviews/public_rpc_exposure_gate.sql
      - name: Service-only billing, payment, tenant guard RPC privileges (PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          db=jco_sensitive_service_rpc_test
          gate=security/reviews/service_only_privileged_rpc_gate.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/service_only_privileged_rpc_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$gate"

          # Direct access to payment confirmation from a tenant MUST be rejected.
          payment='public.process_verified_payment_event(text,text,bigint,text,text,text,text,text)'
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "GRANT EXECUTE ON FUNCTION $payment TO authenticated"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$gate" > "$RUNNER_TEMP/rpc-service-denied.log" 2>&1; then
            echo 'ERROR: authenticated billing webhook RPC accidentally exposed'; exit 1
          fi
          grep -q 'Sensitive service-only RPC exposed to API callers' "$RUNNER_TEMP/rpc-service-denied.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "REVOKE EXECUTE ON FUNCTION $payment FROM authenticated"

          # PUBLIC grants are inherited by BOTH anon and authenticated.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "GRANT EXECUTE ON FUNCTION $payment TO PUBLIC"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$gate" > "$RUNNER_TEMP/rpc-service-denied.log" 2>&1; then
            echo 'ERROR: implicit PUBLIC payment privileges accepted'; exit 1
          fi
          grep -q 'Sensitive service-only RPC exposed to API callers' "$RUNNER_TEMP/rpc-service-denied.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "REVOKE EXECUTE ON FUNCTION $payment FROM PUBLIC"

          # Breaking the trusted webhook access must fail the test too.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "REVOKE EXECUTE ON FUNCTION $payment FROM service_role"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$gate" > "$RUNNER_TEMP/rpc-service-denied.log" 2>&1; then
            echo 'ERROR: service role lockout accepted'; exit 1
          fi
          grep -q 'Service role lost access' "$RUNNER_TEMP/rpc-service-denied.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "GRANT EXECUTE ON FUNCTION $payment TO service_role"

          # New overloaded entrypoint cannot evade signature-based guards.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "CREATE FUNCTION public.platform_set_subscription(text) RETURNS boolean LANGUAGE sql SECURITY DEFINER SET search_path='' AS 'SELECT true'; REVOKE ALL ON FUNCTION public.platform_set_subscription(text) FROM PUBLIC; GRANT EXECUTE ON FUNCTION public.platform_set_subscription(text) TO anon;"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$gate" > "$RUNNER_TEMP/rpc-service-denied.log" 2>&1; then
            echo 'ERROR: exposed overloaded service-only RPC accepted'; exit 1
          fi
          grep -q 'An overloaded service-only function is exposed' "$RUNNER_TEMP/rpc-service-denied.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "DROP FUNCTION public.platform_set_subscription(text)"

          # Fail on missing fixed search_path for sensitive RPCs.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "ALTER FUNCTION $payment RESET search_path"
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$gate" > "$RUNNER_TEMP/rpc-service-denied.log" 2>&1; then
            echo 'ERROR: unpinned trusted function accepted'; exit 1
          fi
          grep -q 'Private RPC lost SECURITY DEFINER or fixed search_path' "$RUNNER_TEMP/rpc-service-denied.log"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "ALTER FUNCTION $payment SET search_path=''"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$gate"

      - name: Verified email invitation acceptance and tenant isolation (PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          db=jco_verified_invitation_claims_test
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/verified_invitation_claim_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f supabase/migrations/20261030203000_verified_email_invitation_claims.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/verified_invitation_claim_assertions.sql

      - name: Tenant organization commercial column ACL and branding regression (PostgreSQL 17)
        env:
          PGPASSWORD: postgres
        run: |
          set -eu
          db=jco_org_commercial_acl_test
          alpha='11111111-1111-4111-8111-111111111111'
          beta='22222222-2222-4222-8222-222222222222'
          editor='33333333-3333-4333-8333-333333333333'
          sql=supabase/migrations/20261030222000_restrict_organization_commercial_updates.sql
          gate=security/reviews/organization_commercial_columns_acl_gate.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE $db"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f security/tests/organization_commercial_acl_fixture.sql

          # Prove the original table-wide UPDATE was exploitable by an
          # authorized tenant editor even though another tenant's row was RLS-isolated.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub','$editor',false); UPDATE public.organizations SET status='SUSPENDED',plan_id='$beta' WHERE id='$alpha';"
          psql -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SELECT status FROM public.organizations WHERE id='$alpha'" | grep -qx SUSPENDED
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "UPDATE public.organizations SET status='ACTIVE',plan_id='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa' WHERE id='$alpha'"

          # Apply ONLY the proposed column privilege migration to the fixture.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$sql"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$gate"

          # Legitimate agency branding remains writable, but only its own.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub','$editor',false); UPDATE public.organizations SET name='New Alpha Name',logo_url='https://example.invalid/logo.png',updated_at=now() WHERE id='$alpha'; UPDATE public.organizations SET name='SHOULD_NOT_CHANGE' WHERE id='$beta';"
          psql -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SELECT name FROM public.organizations WHERE id='$alpha'" | grep -qx 'New Alpha Name'
          psql -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SELECT name FROM public.organizations WHERE id='$beta'" | grep -qx 'Tenant Beta'

          # Even a settings.edit tenant cannot change activation, plan,
          # identifiers or record origin, and an anonymous caller cannot edit.
          for col in "status='SUSPENDED'" "plan_id='$beta'" "slug='reserved-admin'" "id='$beta'" "created_at=now()"; do
            if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub','$editor',false); UPDATE public.organizations SET $col WHERE id='$alpha'" > "$RUNNER_TEMP/org-permission-denied.log" 2>&1; then
              echo "ERROR: authenticated tenant may overwrite protected column $col"; exit 1
            fi
            grep -qi 'permission denied' "$RUNNER_TEMP/org-permission-denied.log"
          done
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SET ROLE anon; UPDATE public.organizations SET name='EVIL' WHERE id='$alpha'" > "$RUNNER_TEMP/org-permission-denied.log" 2>&1; then
            echo 'ERROR: anonymous tenant editing unexpectedly allowed'; exit 1
          fi
          grep -qi 'permission denied' "$RUNNER_TEMP/org-permission-denied.log"

          # The actual SettingsModule uses a privileged owner-only slug RPC;
          # direct tenant UPDATE(slug) must fail without breaking that workflow.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub','$editor',false); SELECT public.set_organization_public_slug('$alpha','new-alpha-url');"
          psql -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SELECT slug FROM public.organizations WHERE id='$alpha'" | grep -qx 'new-alpha-url'
          if psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SET ROLE authenticated; SELECT set_config('request.jwt.claim.sub','44444444-4444-4444-8444-444444444444',false); SELECT public.set_organization_public_slug('$alpha','impostor-url');" > "$RUNNER_TEMP/org-permission-denied.log" 2>&1; then
            echo 'ERROR: a non-owner changed public slug through the RPC'; exit 1
          fi
          grep -qi 'Only organization owner' "$RUNNER_TEMP/org-permission-denied.log"
          psql -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SELECT slug FROM public.organizations WHERE id='$alpha'" | grep -qx 'new-alpha-url'

          # Application SuperAdmin's SECURITY DEFINER / server owner still
          # retains plan and status control without client column grants.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "UPDATE public.organizations SET plan_id='$beta',status='SUSPENDED' WHERE id='$alpha'"
          psql -At -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -c "SELECT status FROM public.organizations WHERE id='$alpha'" | grep -qx SUSPENDED
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d "$db" -f "$gate"

