        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_agency_combined_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_agency_combined_test -f security/tests/property_consignment_fixture.sql
