name: Verify JCO application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jco_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jco_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Approved COP monthly prices and immutable perpetual license SQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_price_catalog_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_price_catalog_test -f security/tests/approved_saas_lifetime_catalog_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_price_catalog_test -f supabase/migrations/20261015074000_approved_monthly_prices_preserve_lifetime.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_price_catalog_test -f supabase/migrations/20261015074000_approved_monthly_prices_preserve_lifetime.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_price_catalog_test -f security/tests/approved_saas_lifetime_catalog_assertions.sql
      - name: Billing approved monthly prices and perpetual contract regression
        run: node --test tests/approved-monthly-prices-preserve-lifetime.test.mjs
      - name: Basic and Pro equal benefits SQL with unchanged resource quotas
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_basic_pro_equal_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_basic_pro_equal_test -f security/tests/approved_saas_lifetime_catalog_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_basic_pro_equal_test -f supabase/migrations/20261015074000_approved_monthly_prices_preserve_lifetime.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_basic_pro_equal_test -f security/tests/basic_pro_functional_parity_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_basic_pro_equal_test -f supabase/migrations/20261015081500_basic_pro_functional_parity.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_basic_pro_equal_test -f supabase/migrations/20261015081500_basic_pro_functional_parity.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_basic_pro_equal_test -f security/tests/basic_pro_functional_parity_assertions.sql
      - name: Basic Pro identical functionality and guarded role access regression
        run: node --test tests/basic-pro-functional-parity.test.mjs
      - name: External portal RLS, customer privacy and staff-seat SQL isolation
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_external_access_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_external_access_test -f security/tests/external_portals_staff_seats_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_external_access_test -f supabase/migrations/20261015092500_isolate_external_accounts_and_staff_seats.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_external_access_test -f supabase/migrations/20261015093000_scope_external_owner_and_tenant_data.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_external_access_test -f supabase/migrations/20261015114500_reconcile_restrictive_portal_read_with_staff_write.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_external_access_test -f security/tests/external_portal_staff_seats_assertions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_external_access_test -f security/tests/external_portal_cross_person_assertions.sql
      - name: Private inventory cross-tenant SELECT safety guard
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_property_boundary_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_property_boundary_test -f security/tests/external_portals_staff_seats_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_property_boundary_test -f supabase/migrations/20261015092500_isolate_external_accounts_and_staff_seats.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_property_boundary_test -f supabase/migrations/20261015093000_scope_external_owner_and_tenant_data.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_property_boundary_test -f supabase/migrations/20261015114500_reconcile_restrictive_portal_read_with_staff_write.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_property_boundary_test -f security/tests/private_properties_tenant_guard_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_property_boundary_test -f supabase/migrations/20261015195500_strict_private_property_read_boundary.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_property_boundary_test -f security/tests/private_properties_tenant_guard_assertions.sql
      - name: Isolated Postgres 17 fixture backup and restore drill
        env:
          PGPASSWORD: postgres
        run: bash security/tests/isolated_backup_restore_rehearsal.sh
      - name: Full private RLS plus public catalog and branding migration integration
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_full_agency_integration_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f security/tests/external_portals_staff_seats_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f supabase/migrations/20261015092500_isolate_external_accounts_and_staff_seats.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f supabase/migrations/20261015093000_scope_external_owner_and_tenant_data.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f supabase/migrations/20261015114500_reconcile_restrictive_portal_read_with_staff_write.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f security/tests/private_properties_tenant_guard_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f supabase/migrations/20261015195500_strict_private_property_read_boundary.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f security/tests/private_properties_tenant_guard_assertions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f security/tests/full_three_migrations_integration_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f supabase/migrations/20261015194000_isolated_real_property_publications.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f supabase/migrations/20261015201000_agency_logos_and_domain_requests.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_full_agency_integration_test -f security/tests/full_three_migrations_integration_assertions.sql
      - name: External portal navigation and no internal CRM data regression
        run: node --test tests/client-portal-only-entry-regression.test.mjs
      - name: Private agency home vs platform landing regression
        run: node --import tsx --test tests/agency-workspace-entry.test.mjs
      - name: Tenant identity and private inventory boundary checks
        run: node --test tests/tenant-boundary-ui-regression.test.mjs
      - name: External role verification must fail closed
        run: node --test tests/external-auth-role-failclosed.test.mjs
      - name: Role permission editor SQL tenant isolation and audit
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_role_perms_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_role_perms_test -f security/tests/admin_role_permissions_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_role_perms_test -f security/tests/admin_role_permissions_assertions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_role_perms_test -f security/tests/tenant_role_portal_isolation_assertions.sql
      - name: Role permission editor interface regression
        run: node --test tests/admin-role-permission-editor.test.mjs
      - name: Advisor coordinator and portal client role regressions
        run: node --test tests/tenant-role-portal-permissions.test.mjs
      - name: Client portal and administrator role entry regression
        run: node --test tests/client-portal-only-entry-regression.test.mjs
      - name: Platform administrator tenant role preview regression
        run: node --test tests/primary-account-tenant-preview.test.mjs
      - name: Organization invitation visibility and history regression
        run: node --import tsx --test tests/organization-invitation-history.test.mjs
      - name: Private rent receipt evidence SQL tenant isolation and atomicity
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_rent_proofs_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_proofs_test -f security/tests/rent_entry_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_proofs_test -f supabase/migrations/20261012120000_owner_statement_deduction_lines.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_proofs_test -f supabase/migrations/20261012130000_rent_receipts_and_owner_drafts.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_proofs_test -f supabase/migrations/20261012140000_reconcile_owner_deductions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_proofs_test -f supabase/migrations/20261012143000_finance_rls_and_tenant_links.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_proofs_test -f supabase/migrations/20261012150000_finance_approval_and_audit_timestamp_hardening.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_proofs_test -f security/tests/rent_receipt_supports_assertions.sql
      - name: Supabase configuration regression tests
        run: node --test tests/supabase-config.test.mjs
      - name: Platform admin access regression tests
        run: node --test tests/platform-admin-access.test.mjs
      - name: Wompi signature verification regression tests
        run: node --import tsx --test tests/wompi-event-verification.test.mjs
      - name: Wompi webhook handler regression tests
        run: node --import tsx --test tests/wompi-webhook-handler.test.mjs
      - name: Supabase payment store regression tests
        run: node --import tsx --test tests/supabase-payment-store.test.mjs
      - name: Payment migration static safety checks
        run: node --test tests/payment-migration-gates.test.mjs
      - name: Platform-only billing access regression
        run: node --test tests/platform-billing-access-review.test.mjs
      - name: Wompi release readiness preflight checks
        run: node --test tests/wompi-release-readiness.test.mjs
      - name: Owner deduction administrator approval regression
        run: node --test tests/owner-deduction-admin-approval.test.mjs
      - name: Wompi private runtime readiness regression
        run: node --test tests/wompi-runtime-readiness.test.mjs
      - name: Wompi HTTP endpoint tests
        run: node --import tsx --test tests/wompi-express-router.test.mjs
      - name: JCO tax policy and approved prices tests
        run: node --import tsx --test tests/jco-pricing-tax-policy.test.mjs
      - name: Trusted Wompi sandbox quote tests
        run: node --import tsx --test tests/wompi-sandbox-order-quote.test.mjs
      - name: Wompi server-only order draft tests
        run: node --import tsx --test tests/wompi-order-draft.test.mjs
      - name: Wompi authorization preflight regression tests
        run: node --import tsx --test tests/wompi-authorized-order-draft.test.mjs
      - name: Trusted Wompi order authorization resolver tests
        run: node --import tsx --test tests/wompi-order-authorization-resolver.test.mjs
      - name: Billing permission contract tests
        run: node --import tsx --test tests/wompi-billing-permission.test.mjs
      - name: Atomic sandbox order SQL safety checks
        run: node --test tests/wompi-atomic-order-sql.test.mjs
      - name: Billing revocation concurrency release-gate checks
        run: node --test tests/wompi-billing-revocation-contract.test.mjs
      - name: Property consignment validation tests
        run: node --import tsx --test tests/property-consignment.test.mjs
      - name: Verified checkout and webhook tests
        run: node --import tsx --test tests/billing-edge-handler.test.mjs
      - name: Wompi canonical domain return URL regression
        run: node --test tests/billing-domain-cutover.test.mjs
      - name: Wompi Edge gateway JWT and signed webhook safety
        run: node --import tsx --test tests/wompi-edge-gateway-auth.test.mjs
      - name: PostgREST explicit deal joins and accurate count regression tests
        run: node --test tests/deals-postgrest-ambiguous-joins.test.mjs
      - name: Deal editing and audited deletion UI checks
        run: node --test tests/deals-edit-safe-delete.test.mjs
      - name: Deal date validation and stage persistence regression tests
        run: node --import tsx --test tests/deals-edit-persistence-regression.test.mjs
      - name: API role table grant hardening and RLS preservation SQL tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_api_grants_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_api_grants_test -f security/tests/api_role_table_grants_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_api_grants_test -f supabase/migrations/20261012235500_restrict_excessive_api_role_table_grants.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_api_grants_test -f security/tests/api_role_table_grants_assertions.sql
      - name: Deal administrator deletion SQL integrity and tenant isolation tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_deals_cleanup_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_deals_cleanup_test -f security/tests/deals_safe_delete_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_deals_cleanup_test -f supabase/migrations/20261012193000_deals_safe_admin_deletion.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_deals_cleanup_test -f security/tests/deals_safe_delete_assertions.sql
      - name: Spanish localization of labels, states and navigation
        run: node --import tsx --test tests/spanish-portal-localization.test.mjs
      - name: Customer menu and monthly overview tests
        run: node --import tsx --test tests/tenant-menu-overview.test.mjs
      - name: Dashboard home card navigation and permission tests
        run: node --import tsx --test tests/dashboard-card-navigation.test.mjs
      - name: Agency logos and pending custom domain isolation SQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_agency_identity_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_agency_identity_test -f security/tests/property_consignment_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_agency_identity_test -f security/tests/agency_brand_domain_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_agency_identity_test -f supabase/migrations/20261015201000_agency_logos_and_domain_requests.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_agency_identity_test -f security/tests/agency_brand_domain_assertions.sql
      - name: Combined public catalog and agency brand SQL migration integration
        env:
