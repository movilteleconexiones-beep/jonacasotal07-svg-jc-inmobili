          grep -Fx 'owner_statements.owner_statement_financial_view|POLICY_BODY_DRIFT' "$policy_report"
          # Restore from the reviewed migration, then assert exact match again.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_external_access_test -f supabase/migrations/20261029070000_repair_financial_portal_select_rls.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_external_access_test -At -F '|' -f "$pinned_policy" > "$policy_report"
          test "$(wc -l < "$policy_report" | tr -d ' ')" = 3
          if grep -v '[|]OK$' "$policy_report"; then
            echo 'Personal policy fixture not safely restored'; exit 1
          fi
