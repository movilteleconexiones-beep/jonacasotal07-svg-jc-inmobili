name: Verify JCO application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jco_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jco_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Supabase configuration regression tests
        run: node --test tests/supabase-config.test.mjs
      - name: Platform admin access regression tests
        run: node --test tests/platform-admin-access.test.mjs
      - name: Wompi signature verification regression tests
        run: node --import tsx --test tests/wompi-event-verification.test.mjs
      - name: Wompi webhook handler regression tests
        run: node --import tsx --test tests/wompi-webhook-handler.test.mjs
      - name: Supabase payment store regression tests
        run: node --import tsx --test tests/supabase-payment-store.test.mjs
      - name: Payment migration static safety checks
        run: node --test tests/payment-migration-gates.test.mjs
      - name: Wompi HTTP endpoint tests
        run: node --import tsx --test tests/wompi-express-router.test.mjs
      - name: JCO tax policy and approved prices tests
        run: node --import tsx --test tests/jco-pricing-tax-policy.test.mjs
      - name: Trusted Wompi sandbox quote tests
        run: node --import tsx --test tests/wompi-sandbox-order-quote.test.mjs
      - name: Wompi server-only order draft tests
        run: node --import tsx --test tests/wompi-order-draft.test.mjs
      - name: Wompi authorization preflight regression tests
        run: node --import tsx --test tests/wompi-authorized-order-draft.test.mjs
      - name: Trusted Wompi order authorization resolver tests
        run: node --import tsx --test tests/wompi-order-authorization-resolver.test.mjs
      - name: Billing permission contract tests
        run: node --import tsx --test tests/wompi-billing-permission.test.mjs
      - name: Atomic sandbox order SQL safety checks
        run: node --test tests/wompi-atomic-order-sql.test.mjs
      - name: Billing revocation concurrency release-gate checks
        run: node --test tests/wompi-billing-revocation-contract.test.mjs
      - name: Property consignment validation tests
        run: node --import tsx --test tests/property-consignment.test.mjs
      - name: Verified checkout and webhook tests
        run: node --import tsx --test tests/billing-edge-handler.test.mjs
      - name: PostgREST explicit deal joins and accurate count regression tests
        run: node --test tests/deals-postgrest-ambiguous-joins.test.mjs
      - name: Deal editing and audited deletion UI checks
        run: node --test tests/deals-edit-safe-delete.test.mjs
      - name: Deal administrator deletion SQL integrity and tenant isolation tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_deals_cleanup_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_deals_cleanup_test -f security/tests/deals_safe_delete_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_deals_cleanup_test -f supabase/migrations/20261012193000_deals_safe_admin_deletion.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_deals_cleanup_test -f security/tests/deals_safe_delete_assertions.sql
      - name: Customer menu and monthly overview tests
        run: node --import tsx --test tests/tenant-menu-overview.test.mjs
      - name: Dashboard home card navigation and permission tests
        run: node --import tsx --test tests/dashboard-card-navigation.test.mjs
      - name: Colombian geography and catalog filter tests
        run: node --import tsx --test tests/catalog-location.test.mjs
      - name: Older official schema, owner trials and monthly overview
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_owner_overview_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f security/tests/billing_activation_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f security/tests/owner_overview_legacy_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f supabase/migrations/20261010231042_compatible_licensing_records.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f supabase/migrations/20261010231042_compatible_licensing_records.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f supabase/migrations/20261010222342_verified_tenant_billing.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f supabase/migrations/20261010222700_commercial_plan_permissions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f supabase/migrations/20261010231048_owner_trials_and_platform_overview.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f supabase/migrations/20261011000300_independent_owner_trial_entitlements.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f security/tests/owner_overview_assertions.sql
      - name: Commercial activation SQL security and atomicity
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_activation_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_activation_test -f security/tests/billing_activation_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_activation_test -f supabase/migrations/20261010222342_verified_tenant_billing.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_activation_test -f supabase/migrations/20261010222700_commercial_plan_permissions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_activation_test -f security/tests/billing_activation_assertions.sql
          bash security/tests/billing_activation_concurrency.sh
      - name: Property consignment SQL security and atomicity tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_consignment_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_consignment_test -f security/tests/property_consignment_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_consignment_test -f supabase/migrations/20261010212630_property_consignment_intake.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_consignment_test -f security/tests/property_consignment_assertions.sql
          bash security/tests/property_consignment_concurrency.sh
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_consignment_test -f security/tests/property_portal_rls_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_consignment_test -f supabase/migrations/20261010214633_fix_property_portal_rls_recursion.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_consignment_test -f security/tests/property_portal_rls_assertions.sql
      - name: Consignment private photo safety checks
        run: node --test tests/consignment-photo-upload.test.mjs
      - name: Private inventory photos security checks
        run: node --test tests/private-inventory-photos.test.mjs
      - name: Billing plan entitlement safety tests
        run: node --test tests/billing-plan-entitlements.test.mjs
      - name: Dual Panel and SuperAdmin navigation regression
        run: node --test tests/dual-panel-navigation-regression.test.mjs
      - name: Consignment photo retry regression
        run: node --test tests/consignment-photo-retry.test.mjs
      - name: Deals form prerequisites and tenant write safety
        run: node --test tests/deals-prerequisites.test.mjs
      - name: Commission prerequisites and safe paid status
        run: node --test tests/commissions-prerequisites.test.mjs
      - name: Active member and organization owner UI safety
        run: node --test tests/member-status-safety.test.mjs
      - name: Report reliability and tenant scoping tests
        run: node --test tests/reports-reliability.test.mjs
      - name: CRM prerequisites and tenant isolation checks
        run: node --test tests/crm-prerequisites.test.mjs
      - name: Commercial form lifecycle and tenant isolation regression
        run: node --test tests/commercial-workflow-reliability.test.mjs
      - name: Central Wompi merchant and non-resale policy checks
        run: node --import tsx --test tests/central-wompi-merchant-nonresale.test.mjs
      - name: Per-tenant logo, palette and website regression
        run: node --import tsx --test tests/tenant-logo-palette-site.test.mjs
      - name: Tenant rent and owner liquidation balances regression
        run: node --import tsx --test tests/rent-owner-financial-balances.test.mjs
      - name: Monthly accounting XLSX and internal receipt tests
        run: node --import tsx --test tests/accounting-monthly-excel-receipts.test.mjs
      - name: Safe tenant, user and role retirement regression
        run: node --test tests/safe-retirement-tenant-users-roles.test.mjs
      - name: Financial form and permission gate regressions
        run: node --test tests/rent-finance-entry-regression.test.mjs
      - name: Signed lease PDF private storage and tenant isolation tests
        run: node --import tsx --test tests/signed-lease-pdf.test.mjs
      - name: Guided rental intake and approval regression tests
        run: node --test tests/rental-intake-guided-flow.test.mjs
      - name: Owner deduction pure accounting tests
        run: node --import tsx --test tests/owner-deduction-ledger.test.mjs
      - name: Owner deduction invoice and payment PDF security tests
        run: node --import tsx --test tests/owner-deduction-pdf-evidence.test.mjs
      - name: Rent receipts and owner statements SQL checks
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_rent_entries_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_entries_test -f security/tests/rent_entry_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_entries_test -f supabase/migrations/20261012120000_owner_statement_deduction_lines.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_entries_test -f supabase/migrations/20261012130000_rent_receipts_and_owner_drafts.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_entries_test -f supabase/migrations/20261012140000_reconcile_owner_deductions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_entries_test -f supabase/migrations/20261012143000_finance_rls_and_tenant_links.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_entries_test -f supabase/migrations/20261012150000_finance_approval_and_audit_timestamp_hardening.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_entries_test -f security/tests/rent_entry_assertions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_rent_entries_test -f security/tests/rent_entry_isolation_assertions.sql
          bash security/tests/rent_receipts_concurrency.sh
      - name: Guided rental activation SQL and duplicate occupied-property tests
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_guided_rent_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_guided_rent_test -f security/tests/rent_entry_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_guided_rent_test -f supabase/migrations/20261012120000_owner_statement_deduction_lines.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_guided_rent_test -f supabase/migrations/20261012130000_rent_receipts_and_owner_drafts.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_guided_rent_test -f supabase/migrations/20261012140000_reconcile_owner_deductions.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_guided_rent_test -f supabase/migrations/20261012143000_finance_rls_and_tenant_links.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_guided_rent_test -f supabase/migrations/20261012150000_finance_approval_and_audit_timestamp_hardening.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_guided_rent_test -f security/tests/rental_intake_admin_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_guided_rent_test -f supabase/migrations/20261012180000_guided_rental_intake_admin_approval.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_guided_rent_test -f security/tests/rental_intake_admin_assertions.sql
      - name: Itemized owner ledger SQL and concurrency checks
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_owner_deductions_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_deductions_test -f security/tests/owner_deductions_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_deductions_test -f supabase/migrations/20261012120000_owner_statement_deduction_lines.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_deductions_test -f security/tests/owner_deductions_assertions.sql
          bash security/tests/owner_deductions_concurrency.sh
      - name: Production build
        run: npm run build
      - name: Cross-tenant RLS regression tests (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d jco_security_test -f security/tests/member_roles_rls_test.sql

      - name: Payment SQL integration tests (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_payment_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f security/tests/payment_staging_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f supabase/migrations/0026_payment_orders_wompi_sandbox.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f supabase/migrations/0027_process_verified_payment_events.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f supabase/migrations/0028_verified_payment_subscription_activation.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f security/tests/payment_staging_assertions.sql

      - name: Approved COP pricing SQL integration (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_pricing_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_pricing_test -f security/tests/pricing_catalog_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_pricing_test -f supabase/migrations/0029_approved_jco_cop_pricing_draft.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_pricing_test -f security/tests/pricing_catalog_assertions.sql

      - name: Billing permission SQL integration (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_billing_permission_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_billing_permission_test -f security/tests/billing_permission_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_billing_permission_test -f supabase/migrations/0030_billing_manage_permission_draft.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_billing_permission_test -f supabase/migrations/0030_billing_manage_permission_draft.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_billing_permission_test -f security/tests/billing_permission_assertions.sql

      - name: Tenant billing authorization RPC tests (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_billing_auth_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_billing_auth_test -f security/tests/billing_auth_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_billing_auth_test -f supabase/migrations/0031_tenant_billing_authorization_draft.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_billing_auth_test -f security/tests/billing_auth_assertions.sql

      - name: Atomic sandbox order SQL integration (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_atomic_order_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_atomic_order_test -f security/tests/atomic_order_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_atomic_order_test -f supabase/migrations/0032_atomic_sandbox_payment_order_draft.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_atomic_order_test -f security/tests/atomic_order_assertions.sql
