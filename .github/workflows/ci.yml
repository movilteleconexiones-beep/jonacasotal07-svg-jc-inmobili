      - name: Encrypted INMOJCO database and private Storage offline backup verification
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_backup_format_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_backup_format_test -c "CREATE TABLE backup_fixture(id bigint PRIMARY KEY, document_name text NOT NULL)"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_backup_format_test -c "INSERT INTO backup_fixture VALUES (1, 'fictitious contract')"
          # Use version 17 tools from the local ephemeral PostgreSQL CI service.
          # Runner-default pg_dump/pg_restore may have an older major version.
          db_container="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          mkdir -p "$RUNNER_TEMP/inmojco-pg17-client"
          for tool in pg_dump pg_restore psql; do
            printf '#!/bin/sh\nexec docker exec -i %s %s "$@"\n' "$db_container" "$tool" > "$RUNNER_TEMP/inmojco-pg17-client/$tool"
            chmod 700 "$RUNNER_TEMP/inmojco-pg17-client/$tool"
          done
          # A separate, disposable source and empty target demonstrate a real
          # PostgreSQL restoration. All records are fabricated; never connect
          # this CI step to Supabase or a production database.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_backup_drill_source"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_backup_drill_restored"
          # A CI-only non-superuser must retain real SELECT grants after restore.
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE ROLE jco_restore_fixture_reader NOLOGIN"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_backup_drill_source -c "CREATE TABLE fixture_organizations(id text PRIMARY KEY, label text NOT NULL); CREATE TABLE fixture_documents(doc_ref text PRIMARY KEY, organization_id text NOT NULL REFERENCES fixture_organizations(id), amount numeric(12,0) NOT NULL, filename text NOT NULL); CREATE INDEX fixture_documents_amount_idx ON fixture_documents(amount); ALTER TABLE fixture_documents ENABLE ROW LEVEL SECURITY; CREATE POLICY fixture_docs_visible ON fixture_documents FOR SELECT TO jco_restore_fixture_reader USING (organization_id = current_setting('app.organization_id', true)); GRANT USAGE ON SCHEMA public TO jco_restore_fixture_reader; GRANT SELECT ON fixture_documents TO jco_restore_fixture_reader"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_backup_drill_source -c "INSERT INTO fixture_organizations VALUES ('org-a','Inmobiliaria ficticia A'),('org-b','Inmobiliaria ficticia B'); INSERT INTO fixture_documents VALUES ('DOC-A','org-a',1300000,'contrato-ficticio-A.pdf'),('DOC-B','org-b',1700000,'contrato-ficticio-B.pdf')"
          PATH="$RUNNER_TEMP/inmojco-pg17-client:$PATH" node --test tests/inmojco-offline-backup.test.mjs tests/inmojco-backup-isolated-restore.test.mjs tests/inmojco-backup-manifest.test.mjs tests/inmojco-backup-package-restore-e2e.test.mjs
