          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_owner_overview_test -f security/tests/owner_overview_assertions.sql
      - name: Commercial activation SQL security and atomicity
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_activation_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_activation_test -f security/tests/billing_activation_fixture.sql
