          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_agency_combined_test -f security/tests/integrated_agency_catalog_brand_assertions.sql
      - name: Domain DNS ownership and public site tenant switch regression
        run: node --import tsx --test tests/agency-domain-site-async-boundary.test.mjs
      - name: Tenant branding partial-save integrity and switch isolation
        run: node --import tsx --test tests/tenant-branding-save-consistency.test.mjs
      - name: Tenant branding asynchronous switch isolation
        run: node --import tsx --test tests/tenant-settings-async-isolation.test.mjs
      - name: Auth session generation and cross-tenant permission isolation
        run: node --import tsx --test tests/auth-session-generation-isolation.test.mjs
      - name: Release gate refuses unsafe database deployment without recovery evidence
        run: node --test tests/release-readiness-gates.test.mjs
      - name: Tenant catalog async and public logo signature safety
