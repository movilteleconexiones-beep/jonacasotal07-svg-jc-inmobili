name: Verify JCO application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jco_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jco_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Supabase configuration regression tests
        run: node --test tests/supabase-config.test.mjs
      - name: Platform admin access regression tests
        run: node --test tests/platform-admin-access.test.mjs
      - name: Production build
        run: npm run build
      - name: Cross-tenant RLS regression tests (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d jco_security_test -f security/tests/member_roles_rls_test.sql
