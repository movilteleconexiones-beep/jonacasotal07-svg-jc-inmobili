name: Verify JCO application

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jco_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jco_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run lint
      - name: Supabase configuration regression tests
        run: node --test tests/supabase-config.test.mjs
      - name: Platform admin access regression tests
        run: node --test tests/platform-admin-access.test.mjs
      - name: Wompi signature verification regression tests
        run: node --import tsx --test tests/wompi-event-verification.test.mjs
      - name: Wompi webhook handler regression tests
        run: node --import tsx --test tests/wompi-webhook-handler.test.mjs
      - name: Supabase payment store regression tests
        run: node --import tsx --test tests/supabase-payment-store.test.mjs
      - name: Payment migration static safety checks
        run: node --test tests/payment-migration-gates.test.mjs
      - name: Wompi HTTP endpoint tests
        run: node --import tsx --test tests/wompi-express-router.test.mjs
      - name: JCO tax policy and approved prices tests
        run: node --import tsx --test tests/jco-pricing-tax-policy.test.mjs
      - name: Trusted Wompi sandbox quote tests
        run: node --import tsx --test tests/wompi-sandbox-order-quote.test.mjs
      - name: Wompi server-only order draft tests
        run: node --import tsx --test tests/wompi-order-draft.test.mjs
      - name: Production build
        run: npm run build
      - name: Cross-tenant RLS regression tests (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d jco_security_test -f security/tests/member_roles_rls_test.sql

      - name: Payment SQL integration tests (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_payment_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f security/tests/payment_staging_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f supabase/migrations/0026_payment_orders_wompi_sandbox.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f supabase/migrations/0027_process_verified_payment_events.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f supabase/migrations/0028_verified_payment_subscription_activation.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_payment_test -f security/tests/payment_staging_assertions.sql

      - name: Approved COP pricing SQL integration (isolated PostgreSQL)
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -c "CREATE DATABASE jco_pricing_test"
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_pricing_test -f security/tests/pricing_catalog_fixture.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_pricing_test -f supabase/migrations/0029_approved_jco_cop_pricing_draft.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_pricing_test -f security/tests/pricing_catalog_assertions.sql
