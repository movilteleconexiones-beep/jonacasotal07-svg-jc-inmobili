          psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d jco_external_access_test -f security/tests/external_signed_lease_private_pdf_assertions.sql
          # #104 - Exact portal policy-expression comparison, including tenant
          # links/status gates, not merely named policy existence.
