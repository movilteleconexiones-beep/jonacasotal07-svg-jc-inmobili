name: G24 seller and precheckout disclosures
on:
  pull_request:
    paths:
      - 'src/modules/billing/BillingModule.tsx'
      - 'src/modules/license/LicenseModule.tsx'
      - 'tests/g24-precheckout-review.test.mjs'
      - '.github/workflows/g24-precheckout-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  precheckout-release-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/g24-precheckout-review.test.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
