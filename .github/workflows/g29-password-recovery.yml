name: G29 recovery UX and security contracts
on:
  pull_request:
    paths:
      - 'src/components/AuthAccessButton.tsx'
      - 'src/components/PasswordResetPage.tsx'
      - 'src/core/password-recovery.ts'
      - 'src/App.tsx'
      - 'tests/g29-password-recovery.test.mjs'
      - '.github/workflows/g29-password-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g29-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify recovery route, anonymity and password change safety
        run: node --test tests/g29-password-recovery.test.mjs
