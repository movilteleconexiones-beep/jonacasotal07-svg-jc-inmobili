name: Backup exporter static validation
on:
  pull_request:
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/backup-export-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/backup/export_private_storage.py
      - name: Validate Bash syntax
        run: bash -n scripts/backup/export_private_backup.sh
