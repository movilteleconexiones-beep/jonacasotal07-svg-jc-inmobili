name: Backup exporter static validation
on:
  pull_request:
    paths:
      - 'scripts/backup/**'
      - '.github/workflows/backup-export-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python3 -m py_compile scripts/backup/export_private_storage.py
      - name: Validate Bash syntax
        run: bash -n scripts/backup/export_private_backup.sh

      - name: Test exporter safety gates with synthetic data
        run: python3 -m unittest discover -s tests/backup -p 'test_*.py'

      - name: Reject interrupted database exports
        run: bash tests/backup/test_incomplete_export.sh
