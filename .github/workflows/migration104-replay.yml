name: INMOJCO #104 disposable chronological PostgreSQL replay
on:
  pull_request:
    paths:
      - 'security/tests/chronological_pg17_*'
      - 'tests/chronological-pg17-*.test.mjs'
      - 'scripts/ops/reconstruct-applied-99.mjs'
      - 'docs/ops/snapshots/**'
      - '.github/workflows/migration104-replay.yml'
  push:
    branches: [main]
    paths:
      - 'security/tests/chronological_pg17_*'
      - 'tests/chronological-pg17-*.test.mjs'
      - 'scripts/ops/reconstruct-applied-99.mjs'
      - '.github/workflows/migration104-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inmojco-104-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pg17-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jco_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jco_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact PR commit
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PG17 replay 26 original SQL bodies, from production history
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          node --test tests/chronological-pg17-first-26.test.mjs
          bash security/tests/chronological_pg17_first_26.sh
