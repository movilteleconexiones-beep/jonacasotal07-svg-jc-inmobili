name: Protected QA clone HTTP
on:
  workflow_dispatch:
    inputs:
      owner_desktop_only:
        description: 'Only retry owner desktop browser journey'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/protected-qa-clone.yml'
      - 'scripts/qa/protected-http-negative.mjs'
      - 'scripts/qa/finance96-run-auth.mjs'
      - 'scripts/qa/finance96-browser-runtime.mjs'
      - 'scripts/qa/private-documents-transactions.test.mjs'
      - 'tests/g16-private-five-role-browser-qa.test.mjs'
permissions:
  contents: read
concurrency:
  group: protected-qa-clone
  cancel-in-progress: false
jobs:
  http-negative:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && !inputs.owner_desktop_only
    environment: qa-clone
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Real HTTP negative acceptance
        run: node scripts/qa/protected-http-negative.mjs
        env:
          JCO_QA96_SUPABASE_URL: ${{ secrets.JCO_QA96_SUPABASE_URL }}
          JCO_QA96_PUBLISHABLE_KEY: ${{ secrets.JCO_QA96_PUBLISHABLE_KEY }}
          JCO_QA96_SECRET_KEY: ${{ secrets.JCO_QA96_SECRET_KEY }}
  browser-mobile:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.http-negative.result == 'success' || needs.http-negative.result == 'skipped') }}
    needs: http-negative
    environment: qa-clone
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm install --ignore-scripts --no-save --package-lock=false playwright@1.56.1
      - run: npx --no-install playwright install --with-deps chromium
      - run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils
      - name: Real authenticated desktop and mobile journeys
        run: node scripts/qa/finance96-run-auth.mjs
        env:
          JCO_QA96_PROVISION: '1'
          JCO_QA96_AUTO_FIXTURES: '1'
          JCO_QA96_RUN_BROWSER: '1'
          JCO_QA203_ONLY_DOCUMENTS: '1'
          JCO_QA203_DOCUMENTS: ${{ github.event_name == 'push' && '1' || '0' }}
          JCO_QA96_OWNER_DESKTOP_ONLY: ${{ (github.event_name == 'push' || inputs.owner_desktop_only) && '1' || '0' }}
          JCO_QA96_SUPABASE_URL: ${{ secrets.JCO_QA96_SUPABASE_URL }}
          JCO_QA96_PUBLISHABLE_KEY: ${{ secrets.JCO_QA96_PUBLISHABLE_KEY }}
          JCO_QA96_SECRET_KEY: ${{ secrets.JCO_QA96_SECRET_KEY }}
